name: Sync personal branch after Zed releases

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-personal-branch
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'NHendrickson9616/zed'
    runs-on: ubuntu-latest

    steps:
      - name: Check out personal branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: personal
          fetch-depth: 0

      - name: Find latest Zed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh release view \
            --repo zed-industries/zed \
            --json tagName \
            --jq .tagName)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          marker_tag="personal-synced-$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$marker_tag" >/dev/null 2>&1; then
            echo "$RELEASE_TAG has already triggered a personal branch sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream main:refs/remotes/upstream/main --tags
          git merge --no-edit upstream/main
          git tag "$marker_tag"
          git push origin HEAD:personal "refs/tags/$marker_tag"

      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Personal branch release sync failed"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json number,title \
            --jq '.[] | select(.title == "Personal branch release sync failed") | .number' \
            | sed -n '1p')"
          body="The personal branch could not sync after Zed release ${RELEASE_TAG:-unknown}. Resolve the conflict locally and rerun the workflow.\n\nWorkflow run: $RUN_URL"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
